# GitLab CI for vauchi-mobile-swift
#
# Swift Package distribution for VauchiMobile
#
# This pipeline:
# - Validates Package.swift syntax
# - Tests package resolution (when binaries are available)
# - Auto-updates on upstream release triggers

include:
  - project: 'vauchi/scripts'
    ref: main
    file: '/ci-templates/reuse.yml'


stages:
  - lint
  - validate
  - test
  - notify

workflow:
  auto_cancel:
    on_new_commit: interruptible

# Validate Package.swift syntax
validate:package:
  stage: validate
  image: swift:5.9
  tags: [docker]
  script:
    - swift package dump-package
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Test package can be resolved (requires released binary)
test:resolve:
  stage: test
  tags:
    - macos
    - self-hosted
  script:
    - swift package resolve
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  allow_failure: true  # May fail if binary not yet published

# Triggered by upstream vauchi/core release
# Updates Package.swift with new version and checksum
update:version:
  stage: validate
  image: alpine:latest
  resource_group: bindings-update
  rules:
    # Accept all trigger sources:
    #   "trigger" = Pipeline Trigger API (trigger-downstream.sh from CI)
    #   "pipeline" = GitLab trigger: keyword (multi-project pipeline)
    #   "api" = Pipeline API with PRIVATE-TOKEN (trigger-downstream.sh locally, or glab)
    - if: ($CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "api") && $UPSTREAM_VERSION
  before_script:
    - apk add --no-cache curl git jq
    - curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign || echo "Warning cosign install failed, skipping verification"
  script:
    - |
      echo "Updating to version $UPSTREAM_VERSION"

      # Strip v prefix for Package.swift version string
      CLEAN_VERSION="${UPSTREAM_VERSION#v}"

      # Download checksum from upstream
      CHECKSUM_URL="https://gitlab.com/api/v4/projects/vauchi%2Fcore/packages/generic/vauchi-mobile/$CLEAN_VERSION/VauchiMobileFFI.xcframework.zip.sha256"
      echo "Fetching checksum from: $CHECKSUM_URL"
      CHECKSUM=$(curl -sf "$CHECKSUM_URL" || true)

      if [[ -z "$CHECKSUM" || "$CHECKSUM" == "null" ]]; then
        echo "Error: Could not fetch checksum from $CHECKSUM_URL"
        exit 1
      fi

      echo "Checksum: $CHECKSUM"

      # Verify checksum signature with cosign if .sig is available
      SIG_URL="${CHECKSUM_URL}.sig"
      COSIGN_PUB_URL="https://gitlab.com/vauchi/core/-/raw/main/cosign.pub"
      echo "Fetching checksum signature from: $SIG_URL"
      if curl -sf -o checksum.sha256.sig "$SIG_URL" && curl -sf -o cosign.pub "$COSIGN_PUB_URL"; then
        echo "$CHECKSUM" > checksum.sha256
        if cosign verify-blob --key cosign.pub --signature checksum.sha256.sig checksum.sha256; then
          echo "Checksum signature verified"
        else
          echo "WARNING: Checksum signature verification FAILED"
        fi
        rm -f checksum.sha256 checksum.sha256.sig cosign.pub
      else
        echo "WARNING: Could not fetch signature or public key — skipping verification"
      fi

      # Download generated Swift bindings from upstream full package
      BINDINGS_URL="https://gitlab.com/api/v4/projects/vauchi%2Fcore/packages/generic/vauchi-mobile/$CLEAN_VERSION/VauchiMobile-$CLEAN_VERSION.zip"
      echo "Fetching Swift bindings from: $BINDINGS_URL"
      curl -sfL -o VauchiMobile.zip "$BINDINGS_URL"
      unzip -o -j VauchiMobile.zip "VauchiMobile-$CLEAN_VERSION/Sources/vauchi_mobile.swift" -d Sources/VauchiMobile/

      # Update Package.swift
      sed -i "s/let version = \".*\"/let version = \"$CLEAN_VERSION\"/" Package.swift
      sed -i "s/let checksum = \".*\"/let checksum = \"$CHECKSUM\"/" Package.swift

      echo "Updated Package.swift:"
      head -8 Package.swift

      # Configure git to push via CI_JOB_TOKEN
      git config user.email "ci@vauchi.com"
      git config user.name "Vauchi CI"
      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      git add Package.swift Sources/VauchiMobile/vauchi_mobile.swift
      git commit -m "chore: Update to $UPSTREAM_VERSION"
      git tag -f "$UPSTREAM_VERSION"
      git push origin HEAD:main --tags --force

# Notify consumer app about new bindings version
# Triggers vauchi/ios to create an MR bumping the dependency
notify:ios-app:
  stage: notify
  image: alpine:latest
  resource_group: notify-downstream
  needs:
    - update:version
  rules:
    - if: ($CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "api") && $UPSTREAM_VERSION
  before_script:
    - apk add --no-cache curl
  script:
    - |
      CLEAN_VERSION="${UPSTREAM_VERSION#v}"
      echo "Notifying vauchi/ios about version $CLEAN_VERSION"

      IOS_APP_PROJECT_ID="77813130"

      response=$(curl -s -w "\n%{http_code}" \
        --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{\"ref\": \"main\", \"variables\": [{\"key\": \"BINDINGS_VERSION\", \"value\": \"$CLEAN_VERSION\"}]}" \
        "${CI_SERVER_URL}/api/v4/projects/$IOS_APP_PROJECT_ID/pipeline")

      http_code=$(echo "$response" | tail -n1)
      body=$(echo "$response" | head -n -1)

      if [ "$http_code" = "201" ] || [ "$http_code" = "200" ]; then
        echo "Triggered iOS app pipeline: $(echo "$body" | grep -o '"web_url":"[^"]*"' | head -1)"
      else
        echo "Failed to trigger ($http_code): $body"
        exit 1
      fi

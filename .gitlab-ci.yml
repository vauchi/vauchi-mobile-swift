# GitLab CI for vauchi-platform-swift
#
# Thin SPM distribution repo. Updates are pushed directly by vauchi/core CI
# (update:swift-bindings job). This pipeline only validates Package.swift syntax.

include:
  - project: 'vauchi/scripts'
    ref: main
    file:
      - '/ci-templates/reuse.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'

stages:
  - lint
  - validate
  - deploy

workflow:
  auto_cancel:
    on_new_commit: interruptible

# Validate Package.swift syntax on every push
validate:package:
  stage: validate
  # Pin to a versioned tag — the GitLab dependency proxy returns 404
  # for the unversioned `swift:5.9` (Docker Hub stopped serving the
  # floating tag, or the proxy can't resolve aliases). 5.9.2 is the
  # final 5.9.x release; bump to 5.10/6.x in a separate MR.
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/swift:5.9.2
  tags: [docker]
  script:
    - swift package dump-package
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Unit-test the pure-Swift CoreUIModels decode surface (the hand-written
# CommandDTO / ActionResult / Component JSON mirrors). VAUCHI_COREUIMODELS_TEST_ONLY
# makes Package.swift emit only CoreUIModels + its test target, so `swift test`
# runs on this Linux image without the Apple-only VauchiPlatformFFI xcframework
# (no download → sidesteps the 2026-04-26 resolve-hang; no macOS runner → no SPM
# mirror race). Apple consumers never set the var, so they resolve the full package.
test:coreuimodels:
  stage: validate
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/swift:5.9.2
  tags: [docker]
  variables:
    VAUCHI_COREUIMODELS_TEST_ONLY: "1"
  script:
    - swift test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Tag invariant guard. Tags v0.21.8..v0.21.12 (2026-04-22) were pushed
# directly to this repo without going through core's update:swift-bindings
# release pipeline, leaving Package.swift's `let version` literal stale at
# "0.21.7". Downstream SPM consumers resolving any of those tags then
# silently downloaded the v0.21.7 xcframework, breaking the premise that
# `Package.swift`'s declared version matches the tag. See
# _private/docs/problems/2026-04-22-phantom-core-registry-artifacts/.
#
# This job runs on every tag pipeline and asserts the invariant. It can't
# *prevent* a bad tag from being pushed (GitLab.com SaaS has no
# pre-receive hooks), but it surfaces the discrepancy loudly so the
# follow-up — re-tagging via the proper pipeline — is unmistakable.
validate:tag-version-invariant:
  stage: validate
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  script:
    - |
      set -e
      VTAG="${CI_COMMIT_TAG#v}"
      PKG_VERSION=$(sed -n 's/^let version = "\([^"]*\)".*/\1/p' Package.swift)
      if [ "$VTAG" != "$PKG_VERSION" ]; then
        echo "ERROR: tag ${CI_COMMIT_TAG} but Package.swift declares let version = \"${PKG_VERSION}\""
        echo ""
        echo "Tags on vauchi-platform-swift must be created by core's"
        echo "update:swift-bindings release job, which writes a"
        echo "'chore: Update to vX' commit that updates let version + let"
        echo "checksum to match the tag. A direct git push of a tag bypasses"
        echo "this invariant and silently breaks downstream SPM consumers."
        echo ""
        echo "Recovery: drop this tag, then create a real release on core/"
        echo "(git tag vX on core's main + push) so update:swift-bindings"
        echo "writes the matching chore commit."
        echo ""
        echo "Ref: _private/docs/problems/2026-04-22-phantom-core-registry-artifacts/"
        exit 1
      fi
      echo "OK: tag ${CI_COMMIT_TAG} matches Package.swift let version = \"${PKG_VERSION}\""
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

pages:
  extends: .badges-pages

github-mirror:
  extends: .github-mirror
  variables:
    GITHUB_MIRROR_REPO: "vauchi-mobile-swift"

# GitLab CI for vauchi-platform-swift
#
# Thin SPM distribution repo. Updates are pushed directly by vauchi/core CI
# (update:swift-bindings job). This pipeline only validates Package.swift syntax.

include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.07.1
    file:
      - '/ci-templates/reuse.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.07.1"

stages:
  - lint
  - validate
  - deploy

workflow:
  auto_cancel:
    on_new_commit: interruptible

# Combined docker lint/validate checks that all run on MRs and main.
# Previously defined separately as validate:package and check:parser-parity.
lint:cross-cutting-blocking:
  stage: lint
  # Pin to a versioned tag — the GitLab dependency proxy returns 404
  # for the unversioned `swift:5.9` (Docker Hub stopped serving the
  # floating tag, or the proxy can't resolve aliases). 5.9.2 is the
  # final 5.9.x release; bump to 5.10/6.x in a separate MR.
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/swift:5.9.2
  tags: [docker]
  needs: []
  allow_failure: false
  variables:
    FRONTEND_NAME: "swift"
    PARSER_FILE: "Sources/CoreUIModels/Models.swift"
    CORE_REF: "main"
  before_script:
    # The parser-parity check needs git, python3 and wget; install them in the
    # Swift image rather than switching images mid-pipeline.
    - apt-get update && apt-get install -y git python3 wget
  script:
    # validate:package — validate Package.swift syntax.
    - swift package dump-package
    # check:parser-parity — verify CoreUIModels covers core's Component enum.
    - |
      set -euo pipefail

      if [ -z "$FRONTEND_NAME" ] || [ -z "$PARSER_FILE" ]; then
        echo "ERROR: FRONTEND_NAME and PARSER_FILE must be set"
        exit 2
      fi

      if [ ! -f "$PARSER_FILE" ]; then
        echo "ERROR: PARSER_FILE not found: $PARSER_FILE"
        exit 2
      fi

      # Fetch only the canonical enum file from core via shallow clone +
      # sparse-checkout — avoids a full clone of the core repo just to
      # read one source file.
      #
      # Wire Humble Tier 0 (2026-05-04, core 0.41.0) split the single
      # `component.rs` into `component/{mod,list,preview}.rs` to keep the
      # file under the size warn threshold. Fetch both paths so this
      # check works against pre-Tier-0 refs (tagged binding versions
      # still pinned to 0.39.0 etc.) and post-Tier-0 main alike.
      mkdir -p .core-parity
      git -C .core-parity init -q
      git -C .core-parity remote add origin https://gitlab.com/vauchi/core.git
      git -C .core-parity sparse-checkout init --no-cone
      git -C .core-parity sparse-checkout set \
        vauchi-app/src/ui/component.rs \
        vauchi-app/src/ui/component
      git -C .core-parity fetch -q --depth 1 origin "$CORE_REF"
      git -C .core-parity checkout -q FETCH_HEAD

      # Prefer the post-Tier-0 layout; fall back to the pre-Tier-0
      # single-file layout for older refs.
      if [ -f .core-parity/vauchi-app/src/ui/component/mod.rs ]; then
        ENUM_FILE=".core-parity/vauchi-app/src/ui/component/mod.rs"
      elif [ -f .core-parity/vauchi-app/src/ui/component.rs ]; then
        ENUM_FILE=".core-parity/vauchi-app/src/ui/component.rs"
      else
        echo "ERROR: failed to fetch core's Component enum at ref $CORE_REF"
        echo "       (looked for component/mod.rs and component.rs under vauchi-app/src/ui/)"
        exit 2
      fi

      # Fetch the parity script. CI_PROJECT_PATH-aware: use the same
      # dependency proxy / mirror the runner already trusts. Falls back
      # to raw HTTPS for non-GitLab environments.
      SCRIPT_URL="https://gitlab.com/vauchi/scripts/-/raw/main/scripts/check-component-parser-parity.py"
      wget -q -O check-parser-parity.py "$SCRIPT_URL"

      python3 check-parser-parity.py \
        --enum-file "$ENUM_FILE" \
        --frontend "$FRONTEND_NAME" \
        --parser-file "$PARSER_FILE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Unit-test the CoreUIModels decode surface (the hand-written CommandDTO /
# ActionResult / Component JSON mirrors). Runs on a macOS runner because
# CoreUIModels imports SwiftUI (the DesignTokens `EnvironmentValues`
# extension), which does not exist on Linux. VAUCHI_COREUIMODELS_TEST_ONLY
# makes Package.swift emit only CoreUIModels + its test target, so `swift
# test` skips the Apple-only VauchiPlatformFFI xcframework entirely — no
# binary download (sidesteps the 2026-04-26 resolve-hang) and no remote
# package resolution (so no SPM mirror race; no resource_group needed).
# --scratch-path/--cache-path keep all SPM state project-local on the shared
# runner. Apple consumers never set the var, so they resolve the full package.
test:coreuimodels:
  stage: validate
  tags:
    - macos
    - self-hosted
  variables:
    VAUCHI_COREUIMODELS_TEST_ONLY: "1"
  before_script:
    - swift --version | head -1
  script:
    - swift test --scratch-path "$CI_PROJECT_DIR/.build" --cache-path "$CI_PROJECT_DIR/.spm-cache"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Tag invariant guard. Tags v0.21.8..v0.21.12 (2026-04-22) were pushed
# directly to this repo without going through core's update:swift-bindings
# release pipeline, leaving Package.swift's `let version` literal stale at
# "0.21.7". Downstream SPM consumers resolving any of those tags then
# silently downloaded the v0.21.7 xcframework, breaking the premise that
# `Package.swift`'s declared version matches the tag. See
# _private/docs/problems/2026-04-22-phantom-core-registry-artifacts/.
#
# This job runs on every tag pipeline and asserts the invariant. It can't
# *prevent* a bad tag from being pushed (GitLab.com SaaS has no
# pre-receive hooks), but it surfaces the discrepancy loudly so the
# follow-up — re-tagging via the proper pipeline — is unmistakable.
validate:tag-version-invariant:
  stage: validate
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  script:
    - |
      set -e
      VTAG="${CI_COMMIT_TAG#v}"
      PKG_VERSION=$(sed -n 's/^let version = "\([^"]*\)".*/\1/p' Package.swift)
      if [ "$VTAG" != "$PKG_VERSION" ]; then
        echo "ERROR: tag ${CI_COMMIT_TAG} but Package.swift declares let version = \"${PKG_VERSION}\""
        echo ""
        echo "Tags on vauchi-platform-swift must be created by core's"
        echo "update:swift-bindings release job, which writes a"
        echo "'chore: Update to vX' commit that updates let version + let"
        echo "checksum to match the tag. A direct git push of a tag bypasses"
        echo "this invariant and silently breaks downstream SPM consumers."
        echo ""
        echo "Recovery: drop this tag, then create a real release on core/"
        echo "(git tag vX on core's main + push) so update:swift-bindings"
        echo "writes the matching chore commit."
        echo ""
        echo "Ref: _private/docs/problems/2026-04-22-phantom-core-registry-artifacts/"
        exit 1
      fi
      echo "OK: tag ${CI_COMMIT_TAG} matches Package.swift let version = \"${PKG_VERSION}\""
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

pages:
  extends: .badges-pages

github-mirror:
  extends: .github-mirror
  variables:
    GITHUB_MIRROR_REPO: "vauchi-mobile-swift"
